server {
    listen 80;
    server_name forensiflow.cs.colman.ac.il;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name forensiflow.cs.colman.ac.il;

    ssl_certificate     /etc/ssl/cs/CSB.crt;
    ssl_certificate_key /etc/ssl/cs/myserver.key;

    root /usr/share/nginx/html;
    index index.html;

    # EVTX uploads can be large
    client_max_body_size 100m;

    # Allow OAuth popups to communicate back via postMessage
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;

    location /api/ {
        proxy_pass http://server:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        # Chat is server-sent events (SSE) - don't buffer it
        proxy_buffering off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
